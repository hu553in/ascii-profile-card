name: ASCII profile card
description: >-
  GitHub Action that generates Neofetch-style SVG profile cards with daily ASCII art and GitHub
  stats.
author: Ruslan Khasanshin
branding:
  icon: terminal
  color: purple

inputs:
  config:
    description: The card described as inline YAML (multiline string).
    required: true
  token:
    description: GitHub token used to fetch stats and push the output branch.
    required: false
    default: ${{ github.token }}
  branch:
    description: Branch the rendered SVGs are published to.
    required: false
    default: output

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: ${{ github.action_path }}/package.json

    - name: Install ascii-image-converter
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/install-ascii-image-converter.sh"

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile --production --cwd "$GITHUB_ACTION_PATH"

    - name: Render the card
      id: render
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        CONFIG: ${{ inputs.config }}
      run: |
        output_dir="$(mktemp -d "$RUNNER_TEMP/ascii-profile-card.XXXXXXXX")"
        OUTPUT_DIR="$output_dir" bun "$GITHUB_ACTION_PATH/src/main.ts"
        printf 'output-dir=%s\n' "$output_dir" >> "$GITHUB_OUTPUT"

    - name: Publish to the output branch
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ inputs.token }}
        publish_branch: ${{ inputs.branch }}
        publish_dir: ${{ steps.render.outputs.output-dir }}
        force_orphan: true
        commit_message: 'chore: update ascii-profile-card'

    - name: Job summary
      shell: bash
      env:
        BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ inputs.branch }}
        OUTPUT_DIR: ${{ steps.render.outputs.output-dir }}
      run: |
        {
          echo '### ascii-profile-card updated'
          echo ''
          for file in "$OUTPUT_DIR"/*.svg; do
            name="$(basename "$file")"
            echo "![$name]($BASE/$name)"
            echo ''
            echo "\`$BASE/$name\`"
            echo ''
          done
        } >> "$GITHUB_STEP_SUMMARY"

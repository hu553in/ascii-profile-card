name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install ascii-image-converter
        run: bash scripts/install-ascii-image-converter.sh

      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libxml2-utils

      - run: bun ci

      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun check:all

  release:
    needs: check
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release-notes
        uses: hu553in/common-things/.github/actions/release-notes@main
      - uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.release-notes.outputs.changelog }}
          draft: true
